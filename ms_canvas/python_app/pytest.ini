[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests (critical < 1s requirement)
    multilingual: marks tests for multilingual functionality
    
# Test collection patterns  
collect_ignore = test_chunking_output.py test_multilingual_chunking.py test_all.py