[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests (critical < 1s requirement)
    multilingual: marks tests for multilingual functionality
    demo: marks tests that generate demonstration output
    benchmark: marks tests as benchmark tests
    
# Test collection patterns for chunking subdirectory
collect_ignore = [
    "tests/chunking/test_chunking_output.py",
    "tests/chunking/test_multilingual_chunking.py", 
    "tests/chunking/test_all.py"
]