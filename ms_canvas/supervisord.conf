[supervisord]
nodaemon=true

[program:go]
command=/app/main
directory=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=10

[program:python]
command=sh -c "if [ -d python_app ]; then cd python_app && . .venv/bin/activate && python -m app.server; else sleep 1d; fi"
directory=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=20
