[supervisord]
nodaemon=true

[program:go]
command=air -c .air.toml
directory=/app/go_app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=10

[program:python]
command=sh -c "if [ -d python_app ]; then cd python_app && python3 -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && python -m pip install build && python -m build && python -m pip install dist/*.whl && python -m app.server; else sleep 1d; fi"
directory=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=20
