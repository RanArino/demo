syntax = "proto3";

package canvas.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "demo/ms_canvas/go_app/api/proto/v1;canvasv1";

//  service for chunking and embeddings.
service Canvas {
  //  service for Nodes
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse);
  rpc CreateClusterNodes(CreateClusterNodesRequest) returns (CreateClusterNodesResponse);
  rpc CreateContentNodes(CreateContentNodesRequest) returns (CreateContentNodesResponse);
  rpc CreateChunkNodes(CreateChunkNodesRequest) returns (CreateChunkNodesResponse);
  rpc UpdateClusterNodes(UpdateClusterNodesRequest) returns (UpdateClusterNodesResponse);
  rpc UpdateContentNodes(UpdateContentNodesRequest) returns (UpdateContentNodesResponse);
  rpc UpdateChunkNodes(UpdateChunkNodesRequest) returns (UpdateChunkNodesResponse);
  rpc DeleteNodes(DeleteNodesRequest) returns (DeleteNodesResponse);

  //  service for Links
  rpc GetLinks(GetLinksRequest) returns (GetLinksResponse);
  rpc GetHierarchicalLinks(GetHierarchicalLinksRequest) returns (GetHierarchicalLinksResponse);
  rpc GetSemanticLinks(GetSemanticLinksRequest) returns (GetSemanticLinksResponse);
  rpc GetStructuralLinks(GetStructuralLinksRequest) returns (GetStructuralLinksResponse);
  rpc CreateHierarchicalLinks(CreateHierarchicalLinksRequest) returns (CreateHierarchicalLinksResponse);
  rpc CreateSemanticLinks(CreateSemanticLinksRequest) returns (CreateSemanticLinksResponse);
  rpc UpdateHierarchicalLinks(UpdateHierarchicalLinksRequest) returns (UpdateHierarchicalLinksResponse);
  rpc UpdateSemanticLinks(UpdateSemanticLinksRequest) returns (UpdateSemanticLinksResponse);
  rpc DeleteLinks(DeleteLinksRequest) returns (DeleteLinksResponse);

  // Python service to chunk and embed
  rpc ChunkEmbed(ChunkEmbedRequest) returns (ChunkEmbedResponse);
  rpc EmbedQuery(EmbedQueryRequest) returns (EmbedQueryResponse);
  rpc Healthz(google.protobuf.Empty) returns (HealthStatus);
}

message HealthStatus {
  string status = 1;
  map<string, string> components = 2;
}

message ChunkingConfig {
  // fixed to "sentence" for this phase
  string type = 1; // "sentence"
  int32 target_tokens = 2; // default 300
  int32 overlap_percent = 3; // default 10
  string tokenizer = 4; // e.g., "tiktoken:cl100k_base"
}

message SpatialCoordinates {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message Chunk {
  string id = 1; // optional client-generated id or empty.
  int32 sequence_index = 2; // the ordinal sequence of the chunk within the document
  int64 start_position = 3; // character offset in original content
  int64 end_position = 4;   // character offset in original content (exclusive)
  string content = 5; // normalized chunk text
  SpatialCoordinates location = 10;  // optional 3D spatial coordinates for the chunk
}

message EmbeddingConfig {
  string provider = 1; // e.g., openai, local
  string model_id = 2;
  string model_version = 3;
}

message EmbedQueryRequest {
  string text = 1;
  EmbeddingConfig config = 10;
}

message EmbedQueryResponse {
  repeated float vector = 1;
  int32 dims = 2;
  string model_id = 3;
  string model_version = 4;
}
// ===== Combined Chunk + Embed =====
message ChunkEmbedRequest {
  string space_id = 1;
  string content_source_id = 2; // FK CONTENT_SOURCE.id (Postgres)
  string content_node_id = 3;   // FK ContentNode.id (Neo4j)

  oneof source {
    string text = 10;       // inline text
    string blob_url = 11;   // URL to fetch processed text (e.g., R2)
  }

  ChunkingConfig chunking = 20;
  EmbeddingConfig embedding = 21;
  int32 batch_size = 22; // optional, for future streaming/batching
}

message ChunkEmbedding {
  Chunk chunk = 1;
  repeated float vector = 2; // embedding for the chunk
}

message ChunkEmbedResponse {
  repeated ChunkEmbedding results = 1; // ordered list aligned with sequence_index
  int32 dims = 2;                      // embedding dimensionality
  string model_id = 3;
  string model_version = 4;
}

// =====  Data Types =====

message MLInfo {
  string clustering_model_version_id = 1;
  string dr_model_version_id = 2;
  string embedding_model_id = 3;
  string model_version = 4;
}

message BaseNode {
  string id = 1;
  string space_id = 2;
  int32 abstraction_level = 3;
  string context_type = 4;
  repeated float embedding = 5;
  repeated string keywords = 6;
  optional string chat_content = 7;
  optional string display_content = 8;
  optional double semantic_density = 9;
  optional SpatialCoordinates position_3d = 10;
  optional bool is_position_locked = 11;
  optional bool visibility = 12;
  optional DisplayProps display_props = 13;
  optional EngagementScore engagement_score = 14;
  optional MLInfo ml_info = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  optional google.protobuf.Timestamp deleted_at = 18;
}

message DisplayProps {
  int32 size = 1;
  double opacity = 2;
  string shape = 3;
  string color = 4;
}

message EngagementScore {
  double canvas_score = 1;
  double chat_score = 2;
  double overall_score = 3;
}

message ChunkNode {
  BaseNode base = 1;
  string content_source_id = 2;
  int32 sequence_index = 3;
  string chunk_type = 4;
  optional int64 start_position = 5;
  optional int64 end_position = 6;
  optional int32 token_count = 7;
  string content = 8;
}

message ContentNode {
  BaseNode base = 1;
  string content_source_id = 2;
  optional string title = 3;
  optional string media_type = 4;
  optional string source = 5;
  optional int32 token_count = 6;
  optional google.protobuf.Struct action_data = 7;
}

message ClusterNode {
  BaseNode base = 1;
  string cluster_scope = 2;
  optional string title = 3;
  optional int32 member_count = 4;
  optional double coverage_score = 5;
}

message BaseLink {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string connection_type = 4;
  optional google.protobuf.Struct exploration_metadata = 5;
  optional google.protobuf.Struct style_metadata = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp deleted_at = 9;
}

message HierarchicalLink {
  BaseLink base = 1;
  int32 hierarchy_depth = 2;
}

message SemanticLink {
  BaseLink base = 1;
  double strength_score = 2;
  double similarity_score = 3;
  bool abstraction_bridge = 4;
  bool hierarchical_bridge = 5;
  repeated string semantic_tags = 6;
  optional string description = 7;
}

message StructuralLink {
  BaseLink base = 1;
  double confidence_score = 2;
  optional string description = 3;
  string created_by = 4;
}

// ===== Node RPC Messages =====

message CreateClusterNodesRequest {
  repeated ClusterNode nodes = 1;
}

message CreateClusterNodesResponse {
  repeated ClusterNode nodes = 1;
}

message CreateContentNodesRequest {
  repeated ContentNode nodes = 1;
}

message CreateContentNodesResponse {
  repeated ContentNode nodes = 1;
}

message CreateChunkNodesRequest {
  repeated ChunkNode nodes = 1;
}

message CreateChunkNodesResponse {
  repeated ChunkNode nodes = 1;
}

message UpdateClusterNodesRequest {
  repeated ClusterNode nodes = 1;
}

message UpdateClusterNodesResponse {
  repeated ClusterNode nodes = 1;
}

message UpdateContentNodesRequest {
  repeated ContentNode nodes = 1;
}

message UpdateContentNodesResponse {
  repeated ContentNode nodes = 1;
}

message UpdateChunkNodesRequest {
  repeated ChunkNode nodes = 1;
}

message UpdateChunkNodesResponse {
  repeated ChunkNode nodes = 1;
}

message DeleteNodesRequest {
  repeated string node_ids = 1;
}

message DeleteNodesResponse {
  int32 deleted_count = 1;
}

// ===== Link RPC Messages =====

message CreateHierarchicalLinksRequest {
  repeated HierarchicalLink links = 1;
}

message CreateHierarchicalLinksResponse {
  repeated HierarchicalLink links = 1;
}

message CreateSemanticLinksRequest {
  repeated SemanticLink links = 1;
}

message CreateSemanticLinksResponse {
  repeated SemanticLink links = 1;
}

message UpdateHierarchicalLinksRequest {
  repeated HierarchicalLink links = 1;
}

message UpdateHierarchicalLinksResponse {
  repeated HierarchicalLink links = 1;
}

message UpdateSemanticLinksRequest {
  repeated SemanticLink links = 1;
}

message UpdateSemanticLinksResponse {
  repeated SemanticLink links = 1;
}

message DeleteLinksRequest {
  repeated string link_ids = 1;
}

message DeleteLinksResponse {
  int32 deleted_count = 1;
}

// =====  Get RPC Messages =====

message GetNodesRequest {
  repeated string ids = 1; // list of node IDs to retrieve
  NodeFilter filter = 2; // optional filter for querying nodes
}

message GetNodesResponse {
  repeated Node nodes = 1; // nodes returned in same order as requested IDs
}

message GetLinksRequest {
  repeated string ids = 1; // list of link IDs to retrieve
  BaseLinkFilter filter = 2; // optional filter for querying links
}

message GetLinksResponse {
  repeated Link links = 1; // links returned in same order as requested IDs
}

message GetHierarchicalLinksRequest {
  repeated string ids = 1; // list of hierarchical link IDs to retrieve
  HierarchicalLinkFilter filter = 2; // optional filter for querying hierarchical links
}

message GetHierarchicalLinksResponse {
  repeated HierarchicalLink links = 1; // hierarchical links returned in same order as requested IDs
}

message GetSemanticLinksRequest {
  repeated string ids = 1; // list of semantic link IDs to retrieve
  SemanticLinkFilter filter = 2; // optional filter for querying semantic links
}

message GetSemanticLinksResponse {
  repeated SemanticLink links = 1; // semantic links returned in same order as requested IDs
}

message GetStructuralLinksRequest {
  repeated string ids = 1; // list of structural link IDs to retrieve
  StructuralLinkFilter filter = 2; // optional filter for querying structural links
}

message GetStructuralLinksResponse {
  repeated StructuralLink links = 1; // structural links returned in same order as requested IDs
}

// =====  Filter Types =====

message NodeFilter {
  optional string space_id = 1;
  optional int32 abstraction_level_min = 2;
  optional int32 abstraction_level_max = 3;
  optional string context_type = 4;
  repeated string keywords = 5;
  optional double semantic_density_min = 6;
  optional double semantic_density_max = 7;
  optional bool is_position_locked = 8;
  optional bool visibility = 9;
  optional string created_after = 10;
  optional string created_before = 11;
  optional string updated_after = 12;
  optional string updated_before = 13;
  // Node-type specific filters
  optional ContentNodeFilter content_filter = 14;
  optional ChunkNodeFilter chunk_filter = 15;
  optional ClusterNodeFilter cluster_filter = 16;
}

message ContentNodeFilter {
  optional string content_source_id = 1;
  optional string title = 2;
  optional string media_type = 3;
  optional string source = 4;
  optional int32 token_count_min = 5;
  optional int32 token_count_max = 6;
}

message ChunkNodeFilter {
  optional string content_source_id = 1;
  optional int32 sequence_index_min = 2;
  optional int32 sequence_index_max = 3;
  optional string chunk_type = 4;
  optional int64 start_position_min = 5;
  optional int64 start_position_max = 6;
  optional int64 end_position_min = 7;
  optional int64 end_position_max = 8;
  optional int32 token_count_min = 9;
  optional int32 token_count_max = 10;
}

message ClusterNodeFilter {
  optional string cluster_scope = 1;
  optional string title = 2;
  optional int32 member_count_min = 3;
  optional int32 member_count_max = 4;
  optional double coverage_score_min = 5;
  optional double coverage_score_max = 6;
}

message BaseLinkFilter {
  optional string source_id = 1;
  optional string target_id = 2;
  optional string connection_type = 3;
  optional google.protobuf.Struct exploration_metadata = 4;
  optional google.protobuf.Struct style_metadata = 5;
  optional string created_after = 6;
  optional string created_before = 7;
  optional string updated_after = 8;
  optional string updated_before = 9;
}

message HierarchicalLinkFilter {
  BaseLinkFilter base = 1;
  optional int32 hierarchy_depth = 2;
}

message SemanticLinkFilter {
  BaseLinkFilter base = 1;
  optional double strength_score_min = 2;
  optional double strength_score_max = 3;
  optional double similarity_score_min = 4;
  optional double similarity_score_max = 5;
  optional bool abstraction_bridge = 6;
  optional bool hierarchical_bridge = 7;
  repeated string semantic_tags = 8;
  optional string description = 9;
}

message StructuralLinkFilter {
  BaseLinkFilter base = 1;
  optional double confidence_score_min = 2;
  optional double confidence_score_max = 3;
  optional string description = 4;
  optional string created_by = 5;
}

message Node {
  oneof node {
    ContentNode content = 1;
    ChunkNode chunk = 2;
    ClusterNode cluster = 3;
  }
}

message Link {
  oneof link {
    HierarchicalLink hierarchical = 1;
    SemanticLink semantic = 2;
    StructuralLink structural = 3;
  }
}

