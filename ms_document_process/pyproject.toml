[tool.poetry]
name = "ms_document_process"
version = "0.1.0"
description = "A microservice to process documents."
authors = ["Ran Arino <ranarino0611ca@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pydantic-settings = ">=2.10.1,<3.0.0"
boto3 = ">=1.34.0,<2.0.0"
confluent-kafka = ">=2.4.0,<3.0.0"
pypdf = ">=4.2.0,<5.0.0"
markitdown = { version = "~=0.1.2", extras = ["pdf"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"