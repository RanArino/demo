services:
  ms_user:
    build:
      context: ./ms_user
      dockerfile: Dockerfile
    ports:
      - "50051:50051"  # gRPC server
      - "8081:8081"    # HTTP webhook server
    env_file:
      - ./ms_user/.env.local
    environment:
      - GRPC_PORT=50051
      - WEBHOOK_PORT=8081
    restart: unless-stopped
    networks:
      - app-network

  ms_knowledge:
    build:
      context: .
      dockerfile: ms_knowledge/Dockerfile
    ports:
      - "50052:50052"
    env_file:
      - ./ms_knowledge/.env.local
    environment:
      - GRPC_PORT=50052
      - MS_USER_GRPC_URL_INTERNAL=ms_user:50051
    restart: unless-stopped
    networks:
      - app-network
  ms_document_process:
    build:
      context: .
      dockerfile: ms_document_process/Dockerfile
    ports:
      - "50053:50053"
    env_file:
      - ./ms_document_process/.env.local
    environment:
      - GRPC_PORT=50053
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_BUCKET_SOURCE_NAME=${R2_BUCKET_SOURCE_NAME}
      - R2_BUCKET_PROCESSED_NAME=${R2_BUCKET_PROCESSED_NAME}
      - MS_KNOWLEDGE_GRPC_URL=ms_knowledge:50052
    depends_on:
      - ms_knowledge
    restart: unless-stopped
    networks:
      - app-network

  ms_canvas:
    build:
      context: ./ms_canvas
      dockerfile: Dockerfile
    ports:
      - "50055:50055"
      - "8082:8080"
    env_file:
      - ./ms_canvas/.env.local
    environment:
      - GRPC_PORT=50055
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
    depends_on:
      - ms_knowledge
    restart: unless-stopped
    networks:
      - app-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3002:3002"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/profile/setup
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/profile/setup
      - MS_USER_GRPC_URL_INTERNAL=ms_user:50051
      - MS_KNOWLEDGE_GRPC_URL_INTERNAL=ms_knowledge:50052
      - MS_CANVAS_GRPC_URL_INTERNAL=ms_canvas:50055
    depends_on:
      - ms_user
    restart: unless-stopped
    networks:
      - app-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "ms_user:8081"
      - "--log=stdout"
      - "--log-level=info"
      - "--domain=${NGROK_STATIC_DOMAIN}"
    env_file:
      - ./.env.local
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - ms_user
    networks:
      - app-network

  

networks:
  app-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.25.0.0/16
        - subnet: 2001:db8:2::/64