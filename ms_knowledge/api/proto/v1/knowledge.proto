syntax = "proto3";

package knowledge.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "demo/ms_knowledge/api/proto/v1;knowledgev1";

// Knowledge Service provides APIs for managing knowledge spaces, content sources, and knowledge graph links
service KnowledgeService {
  // Space Management
  rpc CreateSpace(CreateSpaceRequest) returns (Space);
  rpc GetSpace(GetSpaceRequest) returns (Space);
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  rpc UpdateSpace(UpdateSpaceRequest) returns (Space);
  rpc DeleteSpace(DeleteSpaceRequest) returns (google.protobuf.Empty);

  // Content Source Management
  rpc CreateUploadURL(CreateUploadURLRequest) returns (CreateUploadURLResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ContentSource);
  rpc GetContentSource(GetContentSourceRequest) returns (ContentSource);
  rpc ListContentSources(ListContentSourcesRequest) returns (ListContentSourcesResponse);
  rpc UpdateContentSource(UpdateContentSourceRequest) returns (ContentSource);
  rpc UpdateContentSourceStatus(UpdateContentSourceStatusRequest) returns (ContentSource);
  rpc DeleteContentSource(DeleteContentSourceRequest) returns (google.protobuf.Empty);
  // Download URL Generation
  rpc GenerateDownloadURL(GenerateDownloadURLRequest) returns (GenerateDownloadURLResponse);

  // Knowledge Graph Management
  rpc CreateKnowledgeLink(CreateKnowledgeLinkRequest) returns (KnowledgeLink);
  // Single enriched link by id
  rpc GetKnowledgeLink(GetKnowledgeLinkRequest) returns (EnrichedKnowledgeLink);
  // Focused enriched list by content
  rpc ListKnowledgeLinks(ListKnowledgeLinksRequest) returns (ListKnowledgeLinksResponse);
  // Bulk simple list by space
  rpc ListAllSpaceLinks(ListAllSpaceLinksRequest) returns (ListAllSpaceLinksResponse);
  rpc UpdateKnowledgeLink(UpdateKnowledgeLinkRequest) returns (KnowledgeLink);
  rpc DeleteKnowledgeLink(DeleteKnowledgeLinkRequest) returns (google.protobuf.Empty);
  rpc GetBacklinks(GetBacklinksRequest) returns (GetBacklinksResponse);

  // Utilities
  rpc Healthz(google.protobuf.Empty) returns (HealthStatus);
}


// =============================================================================
// COMMON MESSAGES
// =============================================================================

message Pagination {
  int32 page_size = 1;
  string page_token = 2;
}

// =============================================================================
// SPACE ENTITIES AND MESSAGES
// =============================================================================

enum ViewMode {
  VIEW_MODE_UNSPECIFIED = 0;
  GALLERY = 1;
  LIST = 2;
  CANVAS = 3;
}

enum GridSize {
  GRID_SIZE_UNSPECIFIED = 0;
  SMALL = 1;
  MEDIUM = 2;
  LARGE = 3;
}

message SpaceStats {
  int64 content_count = 1;
  int64 link_count = 2;
  google.protobuf.Timestamp last_activity_at = 3;
}

message Space {
  string id = 1;
  string title = 2;
  string description = 3;
  string owner_id = 4;
  string icon = 5;
  string cover_image = 6;
  repeated string keywords = 7;
  string access_level = 8;
  int64 document_count = 9;
  int64 total_size_bytes = 10;
  SpaceStats stats = 11;
  google.protobuf.Timestamp created_at = 98;
  google.protobuf.Timestamp updated_at = 99;
}

message CreateSpaceRequest {
  string title = 1;
  string description = 2;
  repeated string keywords = 3;
  string icon = 4;
  // string cover_image = 5;
  // string access_level = 6;
}

message GetSpaceRequest {
  string id = 1;
}

message ListSpacesRequest {
  string q = 1;
  string owner_id = 2;
  repeated string keywords = 3;
  string access_level = 4;
  string status = 5;
  google.protobuf.Timestamp created_after = 6;
  google.protobuf.Timestamp created_before = 7;
  google.protobuf.Timestamp updated_after = 8;
  google.protobuf.Timestamp updated_before = 9;
  Pagination page = 10;
}

message ListSpacesResponse {
  repeated Space items = 1;
  string next_page_token = 2;
}

message UpdateSpaceRequest {
  string id = 1; 
  string title = 2;
  string description = 3;
  repeated string keywords = 4;
  string icon = 5;
  // string cover_image = 6;
  // string access_level = 7;
}

message DeleteSpaceRequest {
  string id = 1;
  bool hard_delete = 2;
  bool force = 3;
}

message SpaceFilters {
  string q = 1;
  repeated string keywords = 2;
  string sort_by = 3; // 'name' | 'created' | 'updated' | 'documents'
  string sort_order = 4; // 'asc' | 'desc'
}

message SpacesUIState {
  ViewMode view = 1;
  string search_term = 2;
  repeated string selected_keywords = 3;
  string sort_by = 4;
  string sort_order = 5;
  int32 page = 6;
  int32 page_size = 7;
  bool is_creating = 8;
  optional string is_deleting = 9;
  optional string last_error = 10;
  optional string selected_space_id = 11;
}

message SearchSpacesResponse {
  repeated Space spaces = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// =============================================================================
// CONTENT SOURCE ENTITIES AND MESSAGES
// =============================================================================

message ContentSource {
  string id = 1;
  string space_id = 2;
  ContentStatus status = 3;
  string owner_id = 4;
  string source = 5;
  string mime_type = 6;
  int64 size_bytes = 7;
  string title = 8;
  string original_blob_hash = 9;
  string processed_blob_hash = 10;
  string content_summary = 11;
  repeated string keywords = 12;
  google.protobuf.Timestamp created_at = 98;
  google.protobuf.Timestamp updated_at = 99;
}

message CreateUploadURLRequest {
  string space_id = 1;
  string filename = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
  string title = 5;
  DownloadObjectKind object_kind = 6; // ORIGINAL or PROCESSED (required)
}

message CreateUploadURLResponse {
  string upload_url = 1;
  string object_key = 2;
  google.protobuf.Timestamp expires_at = 3;
  ContentSource content_source = 10;
}

message ConfirmUploadRequest {
  string content_source_id = 1;      // required
  string blob_hash = 3;              // required
}

message GetContentSourceRequest {
  string id = 1;
}

message ListContentSourcesRequest {
  string space_id = 1;
  ContentStatus status = 2;
  Pagination page = 10;
}

message ListContentSourcesResponse {
  repeated ContentSource items = 1;
  string next_page_token = 2;
}

message UpdateContentSourceRequest {
  string id = 1;
  ContentSource content = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateContentSourceStatusRequest {
  string id = 1;
  ContentStatus status = 2;
  string processed_blob_hash = 3;
  string error_message = 4;
}

message DeleteContentSourceRequest {
  string id = 1;
}

// Download URL generation
message GenerateDownloadURLRequest {
  string content_source_id = 1; // required
  int32 expires_seconds = 2;    // optional, server applies bounds and defaults
  DownloadObjectKind object_kind = 3; // required
}

message GenerateDownloadURLResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
  string object_key = 3;
}

enum ContentStatus {
  CONTENT_STATUS_UNSPECIFIED = 0;
  UPLOADING = 1;
  UPLOADED = 2;
  PROCESSING = 3;
  PROCESSED = 4;
  FAILED = 5;
}

enum ContentSourceType {
  CONTENT_SOURCE_TYPE_UNSPECIFIED = 0;
  FILE = 1;
  URL = 2;
  TEXT = 3;
  GOOGLE_DRIVE = 4;
}

// Specifies which object (original or processed) an operation targets
enum DownloadObjectKind {
  DOWNLOAD_OBJECT_KIND_UNSPECIFIED = 0;
  DOWNLOAD_OBJECT_KIND_ORIGINAL = 1;  // source/original object
  DOWNLOAD_OBJECT_KIND_PROCESSED = 2; // processed object
}


// =============================================================================
// KNOWLEDGE LINK ENTITIES AND MESSAGES
// =============================================================================

enum RelationType {
  RELATION_TYPE_UNSPECIFIED = 0;
  REFERENCES = 1;
  CONTAINS = 2;
  RELATED = 3;
  FOLLOWS = 4;
}

enum LinkDirection {
  LINK_DIRECTION_UNSPECIFIED = 0;
  INBOUND = 1;
  OUTBOUND = 2;
  BOTH = 3;
}

// Simple link (used for bulk list)
message KnowledgeLink {
  string id = 1;
  string from_content_id = 2;
  string to_content_id = 3;
  RelationType relation_type = 4;
  double weight = 5;
  google.protobuf.Timestamp created_at = 98;
  google.protobuf.Timestamp updated_at = 99;
}

// Enriched link view (used for focused list and single get)
message ContentPreview {
  string id = 1;
  string title = 2;
  string content_summary = 3;
}

message EnrichedKnowledgeLink {
  string id = 1;
  ContentPreview from = 2;
  ContentPreview to = 3;
  RelationType relation_type = 4;
  double weight = 5;
  google.protobuf.Timestamp created_at = 98;
  google.protobuf.Timestamp updated_at = 99;
}

message CreateKnowledgeLinkRequest {
  string from_content_id = 1;
  string to_content_id = 2;
  RelationType relation_type = 3;
  double weight = 4;
}

message GetKnowledgeLinkRequest {
  string id = 1;
}

// Focused, enriched list by content
message ListKnowledgeLinksRequest {
  string content_id = 1;
  LinkDirection direction = 2;
  RelationType relation_type = 3;
  Pagination page = 10;
}

message ListKnowledgeLinksResponse {
  repeated EnrichedKnowledgeLink items = 1;
  string next_page_token = 2;
}

// Bulk, simple list by space
message ListAllSpaceLinksRequest {
  string space_id = 1;
  RelationType relation_type = 2;
  Pagination page = 10;
}

message ListAllSpaceLinksResponse {
  repeated KnowledgeLink items = 1;
  string next_page_token = 2;
}

message UpdateKnowledgeLinkRequest {
  string id = 1;
  KnowledgeLink link = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message DeleteKnowledgeLinkRequest {
  string id = 1;
}

message GetBacklinksRequest {
  string content_id = 1;
  Pagination page = 10;
}

message GetBacklinksResponse {
  repeated KnowledgeLink items = 1;
  string next_page_token = 2;
}


// =============================================================================
// UTILITY MESSAGES
// =============================================================================

message HealthStatus {
  string status = 1;
  map<string, string> components = 2;
}