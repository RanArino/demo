[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaler-llm"
version = "0.1.0"
description = "Shared LLM providers and types for Scaler microservices"
authors = [{ name = "Scaler Team" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
openai = ["openai>=1.50.0,<2"]
vertex = ["google-cloud-aiplatform>=1.70.0,<2"]
gemini = ["google-generativeai>=0.8.5,<0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pkg", "pkg.*"]